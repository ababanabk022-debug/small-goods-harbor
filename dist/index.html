<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b8cddd" />
    <meta name="description" content="在小岛上停留片刻。旋转视角，看看码头、山坡与流动的海水。" />
    <title>小岛 · 自由漫游</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main class="island-viewer" aria-label="小岛三维场景展示">
      <div id="viewport" aria-label="三维小岛。拖动旋转，滚轮缩放；触屏使用单指旋转、双指缩放。"></div>

      <header class="scene-header">
        <div class="scene-identity">
          <p class="eyebrow">SMALL GOODS <span aria-hidden="true">/</span> LITTLE TIDE</p>
          <h1>小岛 <span class="title-dot" aria-hidden="true">·</span> 自由漫游</h1>
        </div>
        <div class="header-actions">
          <p class="scene-status"><span class="status-dot" aria-hidden="true"></span><span id="scene-status" role="status">正在准备小岛</span></p>
          <button id="help-toggle" class="icon-button" type="button" aria-label="操作说明" aria-controls="help-panel" aria-expanded="false" title="操作说明">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path d="M9.6 9.1a2.45 2.45 0 0 1 4.8.7c0 1.9-2.4 1.9-2.4 3.7"/><path d="M12 16.5h.01"/></svg>
          </button>
        </div>
      </header>

      <aside id="help-panel" class="help-panel" aria-label="操作说明" hidden>
        <p class="panel-title">换个角度，慢慢看</p>
        <dl>
          <div><dt>旋转</dt><dd>鼠标左键拖动 / 单指拖动</dd></div>
          <div><dt>缩放</dt><dd>滚动鼠标滚轮 / 双指开合</dd></div>
          <div><dt>平移</dt><dd>鼠标右键拖动 / 双指拖动</dd></div>
        </dl>
        <p class="help-note">点击「复位」即可回到初始视角。</p>
      </aside>

      <div id="loading" class="loading-overlay" role="status" aria-live="polite">
        <div class="loading-card">
          <div class="loading-mark" aria-hidden="true">
            <svg viewBox="0 0 52 52"><path class="loading-island" d="M11 30c5-2 10-2 15-2s10 0 15 2c-1 5-7 8-15 8s-14-3-15-8Z"/><path d="M27 28c-2-7-2-13 0-18M27 13c-5-6-11-3-13 0 5-1 9-1 13 0Zm0 0c5-6 10-4 13-1-5-1-8 0-13 1Zm-1 1c-6-1-9 4-9 8 3-4 6-6 9-8Zm1 0c5-2 10 2 11 6-4-3-7-5-11-6Z"/><path class="loading-wave" d="M7 42c3-3 6-3 9 0s6 3 9 0 6-3 9 0 6 3 10 0"/></svg>
          </div>
          <p class="loading-title">海风就要来了</p>
          <p id="loading-label">正在载入小岛场景…</p>
          <progress id="loading-progress" max="100" value="0" aria-label="场景加载进度"></progress>
        </div>
      </div>

      <div id="fatal-error" class="error-overlay" role="alert" hidden>
        <div class="error-card">
          <p class="panel-title">小岛暂时无法打开</p>
          <p>请使用支持 WebGL 的浏览器，并确认已启用硬件加速。</p>
        </div>
      </div>

      <div class="controls-wrap">
        <nav class="scene-controls" aria-label="场景控制">
          <div class="view-controls" role="group" aria-label="选择视角">
            <button type="button" class="control-button view-button is-active" data-view="hero" aria-pressed="true" title="正面视角">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-5 8 5v9H4Z"/><path d="M9 19v-6h6v6"/></svg>
              <span class="control-label">正面</span>
            </button>
            <button type="button" class="control-button view-button" data-view="back" aria-pressed="false" title="背面视角">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 19 6-12 4 7 3-5 5 10Z"/><path d="M7 11.2 9 13l1.9-2"/></svg>
              <span class="control-label">背面</span>
            </button>
            <button type="button" class="control-button view-button" data-view="top" aria-pressed="false" title="俯瞰视角">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
              <span class="control-label">俯瞰</span>
            </button>
          </div>
          <span class="control-divider" aria-hidden="true"></span>
          <div class="motion-controls" role="group" aria-label="动画控制">
            <button id="motion-toggle" type="button" class="control-button is-active" aria-pressed="true" title="暂停水面动画">
              <svg class="water-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7c1.5-1.8 3-1.8 4.5 0S10.5 8.8 12 7s3-1.8 4.5 0S19.5 8.8 21 7M3 12c1.5-1.8 3-1.8 4.5 0s3 1.8 4.5 0 3-1.8 4.5 0 3 1.8 4.5 0M3 17c1.5-1.8 3-1.8 4.5 0s3 1.8 4.5 0 3-1.8 4.5 0 3 1.8 4.5 0"/></svg>
              <span class="control-label" id="motion-label">海水流动</span>
              <span class="toggle-indicator" aria-hidden="true"></span>
            </button>
            <button id="auto-rotate" type="button" class="control-button" aria-pressed="false" title="开启自动环绕">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 10a7.5 7.5 0 0 0-12.4-3.6L4 9"/><path d="M4 4.5V9h4.5M4.8 14a7.5 7.5 0 0 0 12.4 3.6L20 15"/><path d="M15.5 15H20v4.5"/></svg>
              <span class="control-label">自动环绕</span>
            </button>
          </div>
          <span class="control-divider" aria-hidden="true"></span>
          <div class="utility-controls" role="group" aria-label="其他控制">
            <button id="reset-view" type="button" class="control-button utility-button" title="复位视角">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .6 6"/><path d="M4 4.5V10h5.5"/></svg>
              <span class="control-label">复位</span>
            </button>
            <button id="fullscreen" type="button" class="control-button utility-button" aria-label="进入全屏" title="进入全屏">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
              <span class="control-label">全屏</span>
            </button>
          </div>
        </nav>
        <p class="interaction-hint"><span class="desktop-hint">拖动旋转 <span aria-hidden="true">·</span> 滚轮缩放</span><span class="touch-hint">单指旋转 <span aria-hidden="true">·</span> 双指缩放</span></p>
      </div>
    </main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
